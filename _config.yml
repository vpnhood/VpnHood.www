# Jekyll Configuration for VpnHood (static marketing site)
title: VpnHood!
description: "VpnHood! – A free, secure, and open-source VPN with a global server network designed to protect your online privacy and ensure secure access to the web."
url: "https://www.vpnhood.com"
baseurl: ""
lang: en-us
# Territory-qualified OG locale for English pages (og:locale meta only — <html lang>
# keeps `lang` above). Translated clones get their own via _plugins/i18n-pages.rb.
locale: en_US
author: VpnHood

# Social media & SEO (consumed by jekyll-seo-tag)
logo: /assets/images/site-icon.png
twitter:
  username: vpnhood
  card: summary_large_image
social:
  name: VpnHood!
  links:
    - https://x.com/vpnhood
    - https://www.linkedin.com/company/vpnhood
    - https://www.instagram.com/vpnhood
    - https://github.com/vpnhood/VpnHood

# Default OG/Twitter image for every page (override per page with front matter `image:`)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png

# Site search (/search/, assets/js/search.js): the Worker that answers it (workers/search/)
# and the Cloudflare Turnstile widget it checks. Neither is a secret. A local build asks
# `wrangler dev` instead, with Cloudflare's always-pass test sitekey: the live widget
# accepts www.vpnhood.com only.
search:
  endpoint: https://search.vpnhood.com/
  turnstile_sitekey: 0x4AAAAAAFqScLUrmoRDVL3a
  dev_endpoint: http://localhost:8787/
  dev_turnstile_sitekey: 1x00000000000000000000AA

# Per-language page trees (/fa/..., /fr/...) are generated at build time by
# _plugins/i18n-pages.rb — no translated page copies exist in the repo. See
# CLAUDE.md "Translations".

# Build settings
markdown: kramdown
highlighter: rouge

# Disable auto-excerpts. Without this, a collection document with no meta
# description would get its whole raw body as jekyll-seo-tag's description
# (seo-tag falls back page.description -> page.excerpt -> site.description).
excerpt_separator: ""

# Sass configuration (sources in _sass/, entry files in assets/css/*.scss)
sass:
  style: compressed
  quiet_deps: true
  silence_deprecations:
    - import
    - global-builtin
    - color-functions

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude non-site files from the build
exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - .github/
  - .vs/
  - .vscode/
  - .tmp/           # scratch notes and screenshots; listed so `jekyll serve` stops rebuilding on every write
  - vh_translator/
  - tools/          # build-time scripts (light art, phone mockups); they were being published as pages
  - workers/        # Cloudflare Worker sources (the site search API); deployed by wrangler, not published

# No `safe: true`: the site builds in our own GitHub Actions workflow (not the legacy
# shared Pages builder that forced safe mode), so custom plugins in _plugins/
# (i18n-meta.rb injects page title/description from _data/i18n/) load in CI and locally.
incremental: false
