name: Build and deploy Jekyll site to GitHub Pages

# Builds the site with the exact Jekyll version pinned in the Gemfile (4.3),
# then publishes the generated _site to GitHub Pages. This replaces the legacy
# branch builder (which used Jekyll 3.9) so the published site matches what we
# build and test locally.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild weekly so legal pages stay synced with the GitHub wiki even when no
  # code is pushed (the wiki can change independently of this repo).
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

# Permissions required by the official Pages deploy actions, plus contents: write
# so the build job can commit freshly translated strings back to main.
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true   # runs bundle install from Gemfile.lock and caches gems

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Pull the latest legal text from the VpnHood GitHub wiki so the privacy /
      # terms pages stay synced. Baked into static HTML at build time (no runtime
      # fetch). If a fetch fails, the step fails and the build is skipped — that's
      # fine: GitHub Pages keeps serving the previous successful deployment.
      - name: Sync legal pages from wiki
        run: |
          for p in VpnHood-CLIENT-Privacy-Policy VpnHood-CONNECT-Privacy-Policy VpnHood-MANAGER-Privacy-Policy VpnHood-MANAGER-Terms-of-Use; do
            curl -sfL "https://raw.githubusercontent.com/wiki/vpnhood/VpnHood/$p.md" -o "_includes/legals/$p.md"
            echo "synced $p"
          done

      # Translate anything stale (source copy edited without running the translator
      # locally) so a deploy never ships untranslated strings. Incremental: the
      # committed vh_translator/watches/ files make this a no-op when nothing
      # changed — and because the results are COMMITTED BACK below, each change is
      # translated exactly once, not on every publish. Fail-fast like the legal
      # sync: on failure the build is skipped and Pages keeps serving the previous
      # deployment. Requires the GEMINI_API_KEY repo secret and
      # VpnHood.Tools.ResourceTranslator >= 1.1.3 on NuGet (version pinned in
      # .config/dotnet-tools.json).
      - name: Set up .NET (vhtranslator)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Translate stale strings
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          dotnet tool restore
          dotnet tool run vhtranslator

      # Push the generated translations + watches back to main so the repo stays in
      # sync and nothing is re-translated on the next publish. Scoped to the
      # translator's own outputs (never the wiki-synced legal pages). No workflow
      # loop: pushes made with GITHUB_TOKEN don't trigger 'push' workflows, and
      # [skip ci] is the belt-and-suspenders. This run continues deploying the
      # already-translated tree either way.
      - name: Commit translations back
        run: |
          git add _data/i18n vh_translator
          if git diff --cached --quiet; then
            echo "translations already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: translate changed strings [skip ci]"
            git push || (git pull --rebase && git push)
          fi

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
