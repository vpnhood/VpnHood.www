name: Build and deploy Jekyll site to GitHub Pages

# Builds the site with the exact Jekyll version pinned in the Gemfile (4.3),
# then publishes the generated _site to GitHub Pages. This replaces the legacy
# branch builder (which used Jekyll 3.9) so the published site matches what we
# build and test locally.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild weekly so legal pages stay synced with the GitHub wiki even when no
  # code is pushed (the wiki can change independently of this repo).
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

# Permissions required by the official Pages deploy actions, plus contents: write
# so the build job can commit freshly translated strings back to main.
permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true   # runs bundle install from Gemfile.lock and caches gems

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Pull the latest legal text so the privacy / terms pages stay synced. Baked
      # into static HTML at build time (no runtime fetch). If a fetch fails, the
      # step fails and the build is skipped — that's fine: GitHub Pages keeps
      # serving the previous successful deployment.
      #
      # The end-user policies live in the VpnHood repo (docs/legal/end-user/, edited
      # via reviewed PRs — merging to develop, that repo's default branch, is
      # publication). MANAGER's pages have not been migrated yet and still come from
      # the GitHub wiki; move each one here as it lands — see
      # docs/legal/end-user/README.md in the VpnHood repo.
      #
      # Repo file name = website slug; the include keeps the wiki-era file name so
      # the page templates don't have to change as pages migrate.
      - name: Sync legal pages
        run: |
          sync_repo() {
            curl -sfL "https://raw.githubusercontent.com/vpnhood/VpnHood/develop/docs/legal/end-user/$1.md" \
              -o "_includes/legals/$2.md"
            echo "synced $2 (VpnHood repo)"
          }
          sync_repo vpnhood-client-privacy-policy VpnHood-CLIENT-Privacy-Policy
          sync_repo vpnhood-connect-privacy-policy VpnHood-CONNECT-Privacy-Policy
          for p in VpnHood-MANAGER-Privacy-Policy VpnHood-MANAGER-Terms-of-Use; do
            curl -sfL "https://raw.githubusercontent.com/wiki/vpnhood/VpnHood/$p.md" -o "_includes/legals/$p.md"
            echo "synced $p (wiki)"
          done

      # Blog content lives in the private vpnhood/VpnHood.Blog repo so its writers
      # never need access to this one; the build pulls it in and renders it with the
      # site's own chrome. BLOG_DEPLOY_KEY is a READ-ONLY deploy key on that repo.
      # Checked out to a dot-folder, which Jekyll ignores, so only the staged copy
      # is ever read as site content.
      #
      # NOTHING ABOUT THE BLOG MAY BLOCK THIS DEPLOY. The marketing site has to stay
      # publishable regardless of the state of the content repo, so this step is
      # continue-on-error and the staging step below falls back to the last good
      # copy. Deliberate: the previous design failed the build on a bad fetch, which
      # let the blog repo hold the whole site hostage.
      - name: Fetch blog content
        id: blog_fetch
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: vpnhood/VpnHood.Blog
          path: .blog-src
          ssh-key: ${{ secrets.BLOG_DEPLOY_KEY }}
          persist-credentials: false

      # Last known-good content, so an unreachable content repo doesn't take the
      # blog off the air (every /blog/ URL 404ing would be far worse than shipping
      # slightly stale posts). Rotating key + prefix restore = "always the newest".
      - name: Restore last good blog content
        uses: actions/cache/restore@v4
        with:
          path: .blog-good
          key: blog-good-${{ github.run_id }}
          restore-keys: blog-good-

      # Re-validate here rather than trusting the content repo's own CI: this build
      # is what publishes, so it is what has to be sure — a writer who merges past a
      # red check still cannot put a broken post on the site. --prune drops only the
      # posts that fail, so one bad file never holds back the rest.
      - name: Validate and stage blog content
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          staged=""

          if [ -d .blog-src/posts ] && python .blog-src/tools/validate-posts.py --prune; then
            rm -rf .blog-good && mkdir -p .blog-good
            cp -r .blog-src/posts .blog-good/posts
            cp -r .blog-src/images .blog-good/images 2>/dev/null || mkdir -p .blog-good/images
            cp .blog-src/redirects.yml .blog-good/redirects.yml 2>/dev/null || true
            staged="fresh"
            echo "BLOG_CACHE_SAVE=1" >> "$GITHUB_ENV"
          elif [ -d .blog-good/posts ]; then
            echo "::warning::blog content unusable this run — falling back to the last good copy"
            staged="cached"
          else
            echo "::warning::no blog content available (fetch failed and no cache) — publishing the site without /blog/"
          fi

          # Replace, never merge: the staged tree must mirror the content repo, so a
          # post or image deleted there disappears from the site.
          rm -rf _blog assets/images/blog _data/blog_redirects.yml
          if [ -n "$staged" ]; then
            mkdir -p _blog assets/images/blog
            cp -r .blog-good/posts/. _blog/
            find .blog-good/images -maxdepth 1 -type f ! -name '.gitkeep' -exec cp {} assets/images/blog/ \; 2>/dev/null || true
            [ -f .blog-good/redirects.yml ] && cp .blog-good/redirects.yml _data/blog_redirects.yml
            echo "staged ($staged) $(find _blog -name '*.md' | wc -l) post(s), $(find assets/images/blog -type f | wc -l) image(s)"
          fi

      - name: Save blog content
        if: env.BLOG_CACHE_SAVE == '1'
        uses: actions/cache/save@v4
        with:
          path: .blog-good
          key: blog-good-${{ github.run_id }}

      # Translate anything stale (source copy edited without running the translator
      # locally) so a deploy never ships untranslated strings. Incremental: the
      # committed vh_translator/watches/ files make this a no-op when nothing
      # changed — and because the results are COMMITTED BACK below, each change is
      # translated exactly once, not on every publish. Requires the GEMINI_API_KEY
      # repo secret and VpnHood.Tools.ResourceTranslator >= 1.1.3 on NuGet (version
      # pinned in .config/dotnet-tools.json).
      #
      # continue-on-error, NOT fail-fast: the translator writes each language file
      # to disk as it finishes it, and saves that source file's watch once its
      # targets are done — so a run that dies on file 12 of 20 has eleven files
      # fully translated on disk. Failing here would skip the commit below and throw
      # all of that away, to be paid for again on the next run. Instead we let the
      # commit capture whatever finished, then fail the job afterwards (see
      # "Stop if translation was incomplete") so a half-translated tree is never
      # deployed. The next run resumes from the committed watches.
      - name: Set up .NET (vhtranslator)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Translate stale strings
        id: translate
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          dotnet tool restore
          dotnet tool run vhtranslator

      # Push the generated translations + watches back to main so the repo stays in
      # sync and nothing is re-translated on the next publish. Scoped to the
      # translator's own outputs (never the wiki-synced legal pages). No workflow
      # loop: pushes made with GITHUB_TOKEN don't trigger 'push' workflows, and
      # [skip ci] is the belt-and-suspenders. This run continues deploying the
      # already-translated tree either way.
      - name: Commit translations back
        run: |
          git add _data/i18n vh_translator
          if git diff --cached --quiet; then
            echo "translations already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: translate changed strings [skip ci]"
            git push || (git pull --rebase && git push)
          fi

      # Only now may an incomplete translation stop the run. Everything the
      # translator finished is committed above, so the work survives and the next
      # run picks up where this one stopped; what we refuse to do is publish a tree
      # where some strings are translated and others are not. deploy needs: build,
      # so Pages keeps serving the previous deployment — same guarantee as before,
      # minus the wasted work.
      - name: Stop if translation was incomplete
        if: steps.translate.outcome == 'failure'
        run: |
          echo "::error::vhtranslator did not finish. Whatever it completed has been committed; \
          re-run this workflow to translate the rest. Skipping deploy so a partly \
          translated site is never published."
          exit 1

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
