<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="vhPartnerArtTitle">
<title id="vhPartnerArtTitle">A storefront with its door lit, handing out a glowing key</title>
<defs>
  <linearGradient id="pBody" x1=".15" y1="0" x2=".85" y2="1">
    <stop offset="0" stop-color="#2b1470" stop-opacity=".95"/>
    <stop offset="1" stop-color="#150a3a" stop-opacity=".95"/></linearGradient>
  <linearGradient id="pAwning" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5b2fd6"/><stop offset=".55" stop-color="#8257f5"/>
    <stop offset="1" stop-color="#c0a4ff"/></linearGradient>
  <linearGradient id="pDoorLight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8ef7e2" stop-opacity=".55"/>
    <stop offset="1" stop-color="#3ce8c8" stop-opacity=".05"/></linearGradient>
  <linearGradient id="pKey" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#3ce8c8"/><stop offset="1" stop-color="#8ef7e2"/></linearGradient>
  <radialGradient id="pAmbient" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity=".3"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="pKeyGlow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#8ef7e2" stop-opacity=".9"/>
    <stop offset=".5" stop-color="#3ce8c8" stop-opacity=".45"/>
    <stop offset="1" stop-color="#22b6d6" stop-opacity="0"/></radialGradient>
  <filter id="pSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="pSofter" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="52"/></filter>
</defs>

<ellipse cx="500" cy="540" rx="440" ry="400" fill="url(#pAmbient)"/>

<!-- shop body -->
<rect x="230" y="440" width="540" height="380" rx="26" fill="#1a0f47"/>
<rect x="230" y="440" width="540" height="380" rx="26" fill="url(#pBody)"/>
<rect x="230" y="440" width="540" height="380" rx="26" fill="none" stroke="#8257f5" stroke-opacity=".4" stroke-width="2"/>

<!-- awning, scalloped along the bottom edge -->
<rect x="196" y="372" width="608" height="78" rx="18" fill="url(#pAwning)"/>
<rect x="196" y="372" width="608" height="78" rx="18" fill="url(#pAwning)" filter="url(#pSoft)" opacity=".45"/>
<g fill="#1a0f47">
  <circle cx="234" cy="450" r="30"/><circle cx="294" cy="450" r="30"/><circle cx="354" cy="450" r="30"/>
  <circle cx="414" cy="450" r="30"/><circle cx="474" cy="450" r="30"/><circle cx="534" cy="450" r="30"/>
  <circle cx="594" cy="450" r="30"/><circle cx="654" cy="450" r="30"/><circle cx="714" cy="450" r="30"/>
  <circle cx="774" cy="450" r="30"/>
</g>
<g fill="#150a3a" fill-opacity=".35">
  <rect x="256" y="372" width="34" height="78"/><rect x="376" y="372" width="34" height="78"/>
  <rect x="496" y="372" width="34" height="78"/><rect x="616" y="372" width="34" height="78"/>
  <rect x="736" y="372" width="34" height="78"/>
</g>

<!-- windows -->
<g fill="#2b1470" stroke="#8257f5" stroke-opacity=".55" stroke-width="3">
  <rect x="276" y="520" width="118" height="112" rx="14"/>
  <rect x="606" y="520" width="118" height="112" rx="14"/>
</g>
<g stroke="#c0a4ff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round">
  <path d="M335 528 v96"/><path d="M284 576 h102"/>
  <path d="M665 528 v96"/><path d="M614 576 h102"/>
</g>

<!-- the door, with light spilling out -->
<rect x="436" y="590" width="128" height="230" rx="18" fill="#150a3a"/>
<rect x="436" y="590" width="128" height="230" rx="18" fill="url(#pDoorLight)"/>
<rect x="436" y="590" width="128" height="230" rx="18" fill="none" stroke="#8ef7e2" stroke-opacity=".5" stroke-width="3"/>
<ellipse cx="500" cy="822" rx="120" ry="34" fill="#3ce8c8" opacity=".28" filter="url(#pSoft)"/>

<!-- the key leaving the shop, along a dotted path -->
<path d="M500 596 C 540 460 640 360 740 296" fill="none" stroke="#c0a4ff" stroke-opacity=".7" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 20"/>
<g transform="rotate(-34 760 250)">
  <circle cx="760" cy="250" r="90" fill="url(#pKeyGlow)" filter="url(#pSoft)"/>
  <rect x="560" y="236" width="170" height="28" rx="14" fill="#3ce8c8" filter="url(#pSoft)" opacity=".7"/>
  <circle cx="760" cy="250" r="48" fill="none" stroke="url(#pKey)" stroke-width="18"/>
  <rect x="560" y="236" width="170" height="28" rx="14" fill="url(#pKey)"/>
  <rect x="582" y="262" width="24" height="36" rx="8" fill="url(#pKey)"/>
  <rect x="624" y="262" width="24" height="30" rx="8" fill="url(#pKey)"/>
</g>

<!-- ground -->
<ellipse cx="500" cy="850" rx="360" ry="70" fill="url(#pAmbient)" opacity=".6" filter="url(#pSofter)"/>
</svg>
