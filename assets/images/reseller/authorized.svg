<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="vhAuthorizedArtTitle">
<title id="vhAuthorizedArtTitle">A storefront with a verified seal above its door</title>
<defs>
  <linearGradient id="aBody" x1=".15" y1="0" x2=".85" y2="1">
    <stop offset="0" stop-color="#2b1470" stop-opacity=".95"/>
    <stop offset="1" stop-color="#150a3a" stop-opacity=".95"/></linearGradient>
  <linearGradient id="aAwning" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5b2fd6"/><stop offset=".55" stop-color="#8257f5"/>
    <stop offset="1" stop-color="#c0a4ff"/></linearGradient>
  <linearGradient id="aDoorLight" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8ef7e2" stop-opacity=".55"/>
    <stop offset="1" stop-color="#3ce8c8" stop-opacity=".05"/></linearGradient>
  <linearGradient id="aSeal" x1=".1" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#c0a4ff"/><stop offset=".5" stop-color="#8257f5"/>
    <stop offset="1" stop-color="#5b2fd6"/></linearGradient>
  <linearGradient id="aCheck" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#3ce8c8"/><stop offset="1" stop-color="#8ef7e2"/></linearGradient>
  <linearGradient id="aRibbon" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#5b2fd6"/><stop offset="1" stop-color="#2b1470"/></linearGradient>
  <radialGradient id="aAmbient" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity=".3"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="aSealGlow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#8ef7e2" stop-opacity=".55"/>
    <stop offset=".55" stop-color="#8257f5" stop-opacity=".35"/>
    <stop offset="1" stop-color="#8257f5" stop-opacity="0"/></radialGradient>
  <filter id="aSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="aSofter" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="52"/></filter>
</defs>

<ellipse cx="500" cy="560" rx="440" ry="400" fill="url(#aAmbient)"/>

<!-- shop body -->
<rect x="190" y="500" width="520" height="350" rx="26" fill="#1a0f47"/>
<rect x="190" y="500" width="520" height="350" rx="26" fill="url(#aBody)"/>
<rect x="190" y="500" width="520" height="350" rx="26" fill="none" stroke="#8257f5" stroke-opacity=".4" stroke-width="2"/>

<!-- awning, scalloped along the bottom edge -->
<rect x="158" y="436" width="584" height="74" rx="18" fill="url(#aAwning)"/>
<rect x="158" y="436" width="584" height="74" rx="18" fill="url(#aAwning)" filter="url(#aSoft)" opacity=".45"/>
<g fill="#1a0f47">
  <circle cx="194" cy="510" r="28"/><circle cx="252" cy="510" r="28"/><circle cx="310" cy="510" r="28"/>
  <circle cx="368" cy="510" r="28"/><circle cx="426" cy="510" r="28"/><circle cx="484" cy="510" r="28"/>
  <circle cx="542" cy="510" r="28"/><circle cx="600" cy="510" r="28"/><circle cx="658" cy="510" r="28"/>
  <circle cx="706" cy="510" r="28"/>
</g>
<g fill="#150a3a" fill-opacity=".35">
  <rect x="214" y="436" width="32" height="74"/><rect x="330" y="436" width="32" height="74"/>
  <rect x="446" y="436" width="32" height="74"/><rect x="562" y="436" width="32" height="74"/>
  <rect x="678" y="436" width="32" height="74"/>
</g>

<!-- windows -->
<g fill="#2b1470" stroke="#8257f5" stroke-opacity=".55" stroke-width="3">
  <rect x="234" y="580" width="112" height="106" rx="14"/>
  <rect x="554" y="580" width="112" height="106" rx="14"/>
</g>
<g stroke="#c0a4ff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round">
  <path d="M290 588 v90"/><path d="M242 633 h96"/>
  <path d="M610 588 v90"/><path d="M562 633 h96"/>
</g>

<!-- the door, with light spilling out -->
<rect x="390" y="636" width="120" height="214" rx="18" fill="#150a3a"/>
<rect x="390" y="636" width="120" height="214" rx="18" fill="url(#aDoorLight)"/>
<rect x="390" y="636" width="120" height="214" rx="18" fill="none" stroke="#8ef7e2" stroke-opacity=".5" stroke-width="3"/>
<ellipse cx="450" cy="852" rx="112" ry="32" fill="#3ce8c8" opacity=".28" filter="url(#aSoft)"/>

<!-- the seal: ribbon tails behind, then the scalloped rosette with a check -->
<circle cx="700" cy="285" r="210" fill="url(#aSealGlow)" filter="url(#aSoft)"/>
<path d="M640 380 L600 520 L640 498 L664 540 L700 400 Z" fill="url(#aRibbon)" stroke="#8257f5" stroke-opacity=".6" stroke-width="3" stroke-linejoin="round"/>
<path d="M760 380 L800 520 L760 498 L736 540 L700 400 Z" fill="url(#aRibbon)" stroke="#8257f5" stroke-opacity=".6" stroke-width="3" stroke-linejoin="round"/>
<g fill="url(#aSeal)">
  <circle cx="700" cy="285" r="130"/>
  <circle cx="828.0" cy="285.0" r="22"/><circle cx="820.3" cy="328.8" r="22"/><circle cx="798.1" cy="367.3" r="22"/>
  <circle cx="764.0" cy="395.9" r="22"/><circle cx="722.2" cy="411.1" r="22"/><circle cx="677.8" cy="411.1" r="22"/>
  <circle cx="636.0" cy="395.9" r="22"/><circle cx="601.9" cy="367.3" r="22"/><circle cx="579.7" cy="328.8" r="22"/>
  <circle cx="572.0" cy="285.0" r="22"/><circle cx="579.7" cy="241.2" r="22"/><circle cx="601.9" cy="202.7" r="22"/>
  <circle cx="636.0" cy="174.1" r="22"/><circle cx="677.8" cy="158.9" r="22"/><circle cx="722.2" cy="158.9" r="22"/>
  <circle cx="764.0" cy="174.1" r="22"/><circle cx="798.1" cy="202.7" r="22"/><circle cx="820.3" cy="241.2" r="22"/>
</g>
<circle cx="700" cy="285" r="100" fill="#1a0f47"/>
<circle cx="700" cy="285" r="100" fill="url(#aBody)"/>
<circle cx="700" cy="285" r="100" fill="none" stroke="#c0a4ff" stroke-opacity=".55" stroke-width="4"/>
<circle cx="700" cy="285" r="86" fill="none" stroke="#c0a4ff" stroke-opacity=".25" stroke-width="2" stroke-dasharray="3 9"/>
<path d="M652 288 L686 322 L752 252" fill="none" stroke="#3ce8c8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#aSoft)" opacity=".7"/>
<path d="M652 288 L686 322 L752 252" fill="none" stroke="url(#aCheck)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

<!-- ground -->
<ellipse cx="450" cy="880" rx="360" ry="70" fill="url(#aAmbient)" opacity=".6" filter="url(#aSofter)"/>
</svg>
