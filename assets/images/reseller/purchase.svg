<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000" role="img" aria-labelledby="vhPurchaseArtTitle">
<title id="vhPurchaseArtTitle">A shop's paid receipt with a glowing key</title>
<defs>
  <linearGradient id="rPaper" x1=".15" y1="0" x2=".85" y2="1">
    <stop offset="0" stop-color="#2b1470" stop-opacity=".97"/>
    <stop offset="1" stop-color="#150a3a" stop-opacity=".97"/></linearGradient>
  <linearGradient id="rAwning" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5b2fd6"/><stop offset=".55" stop-color="#8257f5"/>
    <stop offset="1" stop-color="#c0a4ff"/></linearGradient>
  <linearGradient id="rKey" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#3ce8c8"/><stop offset="1" stop-color="#8ef7e2"/></linearGradient>
  <radialGradient id="rAmbient" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity=".3"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <radialGradient id="rKeyGlow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#8ef7e2" stop-opacity=".9"/>
    <stop offset=".5" stop-color="#3ce8c8" stop-opacity=".45"/>
    <stop offset="1" stop-color="#22b6d6" stop-opacity="0"/></radialGradient>
  <filter id="rSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<ellipse cx="500" cy="520" rx="430" ry="420" fill="url(#rAmbient)"/>

<!-- the receipt, tilted a little, with a torn zigzag bottom edge -->
<g transform="rotate(-6 500 500)">
  <path d="M320 150 h360 a26 26 0 0 1 26 26 V820 l-32 26 -32 -26 -32 26 -32 -26 -32 26 -32 -26 -32 26 -32 -26 -32 26 -32 -26 -32 26 -32 -26 -32 26 V176 a26 26 0 0 1 26 -26 Z"
        fill="url(#rPaper)" stroke="#8257f5" stroke-opacity=".5" stroke-width="3"/>

  <!-- the shop's header: a small awning -->
  <rect x="294" y="150" width="412" height="64" rx="26" fill="url(#rAwning)"/>
  <g fill="#1f1152">
    <circle cx="326" cy="214" r="22"/><circle cx="370" cy="214" r="22"/><circle cx="414" cy="214" r="22"/>
    <circle cx="458" cy="214" r="22"/><circle cx="502" cy="214" r="22"/><circle cx="546" cy="214" r="22"/>
    <circle cx="590" cy="214" r="22"/><circle cx="634" cy="214" r="22"/><circle cx="678" cy="214" r="22"/>
  </g>

  <!-- lines of the receipt -->
  <g fill="#c0a4ff" fill-opacity=".35">
    <rect x="350" y="290" width="200" height="16" rx="8"/><rect x="590" y="290" width="70" height="16" rx="8"/>
    <rect x="350" y="340" width="160" height="16" rx="8"/><rect x="590" y="340" width="70" height="16" rx="8"/>
    <rect x="350" y="390" width="220" height="16" rx="8"/><rect x="590" y="390" width="70" height="16" rx="8"/>
  </g>
  <path d="M350 450 H660" stroke="#c0a4ff" stroke-opacity=".35" stroke-width="3" stroke-dasharray="10 10"/>
  <g fill="#e6dcff" fill-opacity=".75">
    <rect x="350" y="486" width="120" height="22" rx="11"/><rect x="570" y="486" width="90" height="22" rx="11"/>
  </g>

  <!-- the paid stamp -->
  <g transform="rotate(-14 560 650)">
    <circle cx="560" cy="650" r="92" fill="none" stroke="#3ce8c8" stroke-opacity=".85" stroke-width="8"/>
    <circle cx="560" cy="650" r="74" fill="none" stroke="#3ce8c8" stroke-opacity=".45" stroke-width="3"/>
    <path d="M520 652 L548 680 L604 622" fill="none" stroke="url(#rKey)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>

<!-- the key it bought, glowing beside the receipt -->
<g transform="rotate(28 250 700)">
  <circle cx="250" cy="700" r="80" fill="url(#rKeyGlow)" filter="url(#rSoft)"/>
  <circle cx="250" cy="700" r="42" fill="none" stroke="url(#rKey)" stroke-width="16"/>
  <rect x="290" y="688" width="150" height="24" rx="12" fill="url(#rKey)"/>
  <rect x="396" y="710" width="22" height="32" rx="7" fill="url(#rKey)"/>
  <rect x="360" y="710" width="22" height="26" rx="7" fill="url(#rKey)"/>
</g>
</svg>
