# Code the copy shows - commands, paths, ports, on-screen text - each under the
# name the copy uses as its placeholder.
#
# STRUCTURE, not copy, for the same reason as pricing.yml: vhtranslator only
# walks _data/i18n/en, so nothing here is ever sent to the translator, and a
# command cannot come back with a translated word or Persian digits in it.
#
# The copy keeps the <code> tags and puts the placeholder inside them -
# "On Linux, <code>[vhserver_gen]</code> prints a new one." - and the page
# renders the string through _includes/copy.html, which fills in every name
# below. A value is inserted as HTML, so write < and & as &lt; and &amp;. A
# whole command in a terminal block stays in the page markup.
#
# Every value here comes from the product: the install scripts published with
# each VpnHood! SERVER release, and the server source in the VpnHood repo.

# VpnHood! SERVER
vhserver_gen: "vhserver gen"
vhserver_print: "vhserver print"
vhserver_run: "sudo /opt/VpnHoodServer/vhserver"
vhserver_stop: "sudo /opt/VpnHoodServer/vhserver stop"
server_dir_linux: "/opt/VpnHoodServer"
server_service: "VpnHoodServer"
server_updater: "VpnHoodServerUpdater"
server_port: "443"
autostart_prompt_linux: "Start the server at boot (Y/n)?"
autoupdate_prompt_linux: "Keep the server up to date by itself (Y/n)?"
flag_quiet: "-q"
flag_no_auto_start: "-noautostart"
flag_no_auto_update: "-noautoupdate"
flag_help: "-help"
flag_http_base_url: "-httpBaseUrl"
flag_http_authorization: "-httpAuthorization"
flag_management_secret: "-managementSecret"
flag_purge: "-purge"
answer_yes: "y"
accesskey_heading: "--- AccessKey ---"
hostendpoints_label: "HostEndPoints:"
key_prefix: "vh:"
server_storage: "/opt/VpnHoodServer/storage"
server_appsettings: "/opt/VpnHoodServer/storage/appsettings.json"
server_log: "/opt/VpnHoodServer/storage/logs/server.log"
server_access_dir: "/opt/VpnHoodServer/storage/access"
server_cert_pfx: "/opt/VpnHoodServer/storage/access/certificates/default.pfx"
key_file_ext: ".token2"
log_could_not_start: "The server could not start."
server_restart_linux: "sudo systemctl restart VpnHoodServer"
port_http: "80"
port_ssh: "22"

# VpnHood! SERVER settings in appsettings.json, as the server reads them (case-sensitive)
setting_file_access_manager: "FileAccessManager"
setting_tcp_endpoints: "TcpEndPoints"
setting_udp_endpoints: "UdpEndPoints"
setting_quic_endpoints: "QuicEndPoints"
setting_public_endpoints: "PublicEndPoints"
setting_is_valid_host_name: "IsValidHostName"
setting_ssl_password: "SslCertificatesPassword"
setting_allow_tcp_packet: "AllowTcpPacket"
setting_allow_quic_packet: "AllowQuicPacket"
setting_allow_udp_packet: "AllowUdpPacket"
setting_allow_tcp_proxy: "AllowTcpProxy"
setting_reverse_proxy_providers: "ReverseProxyProviders"
setting_reverse_proxy_ip_ranges: "ReverseProxyIpRanges"
json_providers_cloudfront: '["Cloudflare", "CloudFront"]'
json_true: "true"
json_false: "false"
json_empty_list: "[]"
ip_any_v4: "0.0.0.0"
ip_any_v6: "[::]"
log_public_endpoints: "PublicEndPoints has not been configured properly."

# VpnHood! SERVER in Docker (from v8.2: the image updates itself, no Watchtower)
installer_linux: "VpnHoodServer-linux.sh"
installer_docker: "VpnHoodServer.docker.sh"
docker_prompt: "Install Docker (y/n)?"
answer_no: "n"
flag_install_docker: "-install-docker"
docker_container: "VpnHoodServer"
docker_image: "vpnhood/vpnhoodserver"
docker_restart: "sudo docker restart VpnHoodServer"
docker_exec_supervisor: "sudo docker exec VpnHoodServer /app/vhsupervisor"
docker_network_host: "--network host"
env_auto_update_off: "VH_AUTO_UPDATE=0"
env_appsettings: "VH_APPSETTINGS"
log_pull_image: "Pull the latest image!"
old_updater_container: "VpnHoodUpdater"

# Example addresses, from the ranges set aside for documentation (RFC 5737), so no
# reader's real server is ever named. The /vpnhood-server/docs/ip-blocking/ copy, its
# commands and its diagram (tools/make-docs-diagrams.py) all use these two; a reverse
# proxy's range takes the third, so it never holds either of them.
ip_connection_example: "203.0.113.10"
ip_outgoing_example: "198.51.100.20"
ip_range_example: "192.0.2.0/24"
# and a name from the domains set aside for documentation (RFC 2606)
domain_example: "server1.example.com"
domain_api_example: "api.example.com"

# The operating system, as its commands print it
route_src: "src"

