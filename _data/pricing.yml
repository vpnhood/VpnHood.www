# Premium prices: the single source of truth for every number on
# /free-vpn/go-premium/.
#
# STRUCTURE, not copy. It lives here and not under _data/i18n/ for one reason:
# vhtranslator only walks _data/i18n/en, so a price written here can never be
# rewritten by a translation pass. The prices used to sit in
# free_vpn_go_premium.json, where twelve translated copies of "$7.9" were one
# bad pass away from disagreeing with the checkout.
#
# The sentences around the numbers stay translatable, as templates with
# placeholders that the page fills in: save_percent ({percent}), save_amount
# ({amount}) and billed_multi ({was}, {now}, {months}).
#
# Prices are written with their symbol so a currency change is one edit here.
# Keep them consistent with the WHMCS product: a plan's billing_cycle is the
# billingcycle parameter of its cart URL, and product_id is the pid.

# The code shown beside every price. "$" alone is ambiguous to a Canadian,
# Australian, Singaporean or Hong Kong reader, who would otherwise only learn the
# currency at checkout; a code is the same string in every language, so it lives
# here and is filled into the translatable per_month label.
currency: USD

product_id: 18
cart_url: https://account.vpnhood.com/cart.php

free_price: "$0"

# The undiscounted monthly rate, struck through beside a discounted plan.
base_price: "$7.9"

# Order is display order: 1 month, 6 months, 12 months.
plans:
  - key: month1
    billing_cycle: monthly
    price: "$7.9"
    save_percent: 0
  - key: month6
    billing_cycle: semiannually
    price: "$5.9"
    save_percent: 25
    months: 6
    total_was: "$47.4"
    total_now: "$35.4"
    save_amount: "$12"
  - key: month12
    billing_cycle: annually
    price: "$3.9"
    save_percent: 45
    months: 12
    total_was: "$94.8"
    total_now: "$46.8"
    save_amount: "$48"
