# Language metadata: native-script display name for the selector
# (_includes/lang-selector.html), layout direction for <html dir> + the
# Helix ltr/rtl body class (header.html), and og_locale — the territory-
# qualified Open Graph locale (language_TERRITORY, from Facebook's locale
# registry). og_locale feeds ONLY the og:locale / og:locale:alternate meta
# tags (via page.locale, stamped on clones by _plugins/i18n-pages.rb, and
# the alternates block in header.html) — it never appears in URLs,
# <html lang>, or hreflang, which all stay bare language codes.
# This is NOT a language registry: a language appears in the selector only when
# its _data/i18n/<code>/ folder exists (generated by vhtranslator). An unlisted
# code falls back to showing the code itself, direction ltr, og_locale = code.
en:
  name: English
  dir: ltr
  og_locale: en_US
fa:
  name: فارسی
  dir: rtl
  og_locale: fa_IR
ar:
  name: العربية
  dir: rtl
  og_locale: ar_AR # Facebook's generic Arabic locale
de:
  name: Deutsch
  dir: ltr
  og_locale: de_DE
es:
  name: Español
  dir: ltr
  og_locale: es_ES
fr:
  name: Français
  dir: ltr
  og_locale: fr_FR
he:
  name: עברית
  dir: rtl
  og_locale: he_IL
hi:
  name: हिन्दी
  dir: ltr
  og_locale: hi_IN
id:
  name: Bahasa Indonesia
  dir: ltr
  og_locale: id_ID
it:
  name: Italiano
  dir: ltr
  og_locale: it_IT
ja:
  name: 日本語
  dir: ltr
  og_locale: ja_JP
ko:
  name: 한국어
  dir: ltr
  og_locale: ko_KR
pt:
  name: Português
  dir: ltr
  og_locale: pt_PT
pt-BR:
  name: Português (Brasil)
  dir: ltr
