# The docs sidebar of each product, keyed by the first segment of the URL (the
# product folder), read by _includes/docs.html. Each group names a key in
# _data/i18n/en/nav_labels.json and lists its pages in reading order; a page's
# label defaults to the last segment of its URL, so the sidebar and the
# breadcrumb always call a page the same thing. The section's docs index lists
# the same pages. List only pages that exist: the link check fails on anything
# else.
vpnhood-server:
  - group: getting-started
    pages:
      - url: /vpnhood-server/docs/install/
      - url: /vpnhood-server/docs/docker/
      - url: /vpnhood-server/docs/ip-blocking/
  - group: reference
    pages:
      - url: /vpnhood-server/docs/ip-addresses/
      - url: /vpnhood-server/docs/domain/
      - url: /vpnhood-server/docs/reverse-proxy/
vpnhood-manager:
  - group: reference
    pages:
      - url: /vpnhood-manager/docs/certificates/
